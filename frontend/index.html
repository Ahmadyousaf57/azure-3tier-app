<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3-Tier App on Azure</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    input, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; }
    #msg { min-height: 1.2em; }
    li { margin: 4px 0; }
  </style>
</head>
<body>
  <h2>3-Tier App (Azure)</h2>
  <input id="name" placeholder="Name">
  <input id="email" type="email" placeholder="Email">
  <button id="save">Submit</button>
  <p id="msg"></p>
  <h3>Saved users</h3>
  <ul id="list"></ul>
  <script>
    async function load() {
      const res = await fetch('/api/users');
      const users = await res.json();
      const ul = document.getElementById('list');
      ul.textContent = '';
      users.forEach(u => {
        const li = document.createElement('li');
        li.textContent = u.name + ' (' + u.email + ')';
        ul.appendChild(li);
      });
    }
    document.getElementById('save').addEventListener('click', async () => {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const msg = document.getElementById('msg');
      const res = await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email })
      });
      msg.textContent = res.ok ? 'Saved!' : 'Error saving';
      if (res.ok) { document.getElementById('name').value = ''; document.getElementById('email').value = ''; load(); }
    });
    load();
  </script>
</body>
</html>
